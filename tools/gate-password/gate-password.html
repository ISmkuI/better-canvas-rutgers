<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PotatoCanvas 高级功能密码</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f3f4f6; color: #1f2328; }
  @media (prefers-color-scheme: dark) { body { background: #121417; color: #e6e8eb; } .card { background: #1b1f24 !important; border-color: #2e343c !important; } input, .sub { border-color: #2e343c !important; background: #121417 !important; color: #e6e8eb !important; } }
  .card { width: min(440px, 92vw); background: #fff; border: 1px solid #e3e6ea; border-radius: 14px; padding: 22px 24px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .muted { color: #6b7280; font-size: 12px; }
  .code { font: 700 40px/1.2 ui-monospace, Consolas, "Cascadia Mono", monospace; letter-spacing: .08em; margin: 14px 0 6px; user-select: all; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { padding: 7px 12px; border: 1px solid #cc0033; background: #cc0033; color: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button.ghost { background: transparent; color: inherit; border-color: #c9cdd3; }
  .bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
  .bar i { display: block; height: 100%; background: #cc0033; transition: width 1s linear; }
  .sub { margin-top: 16px; padding-top: 12px; border-top: 1px solid #e3e6ea; }
  .sub .code { font-size: 18px; margin: 4px 0; }
  details { margin-top: 14px; font-size: 12px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #c9cdd3; border-radius: 8px; font: 13px ui-monospace, Consolas, monospace; margin-top: 6px; }
  .hash { font: 12px ui-monospace, Consolas, monospace; word-break: break-all; margin-top: 6px; }
  .ok { color: #2e7d32; }
</style>
</head>
<body>
<div class="card">
  <h1>🔒 PotatoCanvas 高级功能密码</h1>
  <div class="muted">每小时自动更换；扩展弹窗里也接受上一小时的密码。</div>

  <div class="code" id="code">--------</div>
  <div class="bar"><i id="bar" style="width:100%"></i></div>
  <div class="row">
    <span class="muted" id="left">⏳</span>
    <span style="flex:1"></span>
    <button id="copy">复制</button>
  </div>

  <div class="sub">
    <div class="muted">上一小时（仍可用） / 下一小时（提前发给别人）</div>
    <div class="row"><span class="code" id="prev">--------</span><span class="muted">·</span><span class="code" id="next">--------</span></div>
  </div>

  <details>
    <summary>密钥（必须和 src/gate.js 里的 SECRET 一样）</summary>
    <input id="secret">
  </details>
</div>

<script>
  // 和 src/gate.js 保持一致：HMAC-SHA256(SECRET, "bc-gate:" + 小时序号) → 前 8 字节各取模 32 映射到字母表
  const DEFAULT_SECRET = "uhNKemzqdAGy360foPFDZ9Cv4nvmDQy-";
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const enc = s => new TextEncoder().encode(s);
  const $ = id => document.getElementById(id);
  const secretEl = $("secret");
  secretEl.value = localStorage.getItem("bc-gate-secret") || DEFAULT_SECRET;
  secretEl.addEventListener("input", () => { localStorage.setItem("bc-gate-secret", secretEl.value); tick(true); });

  async function code(offset) {
    const key = await crypto.subtle.importKey("raw", enc(secretEl.value), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const mac = new Uint8Array(await crypto.subtle.sign("HMAC", key, enc("bc-gate:" + (Math.floor(Date.now() / 3600000) + offset))));
    let out = ""; for (let i = 0; i < 8; i++) out += ALPHABET[mac[i] % ALPHABET.length];
    return out.slice(0, 4) + "-" + out.slice(4);
  }
  let lastHour = -1;
  async function tick(force) {
    const hour = Math.floor(Date.now() / 3600000);
    if (force || hour !== lastHour) {
      lastHour = hour;
      const [c, p, n] = await Promise.all([code(0), code(-1), code(1)]);
      $("code").textContent = c; $("prev").textContent = p; $("next").textContent = n;
      document.title = c + " · PotatoCanvas";
    }
    const secLeft = 3600 - Math.floor((Date.now() % 3600000) / 1000);
    const m = String(Math.floor(secLeft / 60)).padStart(2, "0"), s = String(secLeft % 60).padStart(2, "0");
    $("left").textContent = `⏳ 还剩 ${m}:${s} 换下一个`;
    $("bar").style.width = (secLeft / 36) + "%";
  }
  tick(true); setInterval(tick, 1000);

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("code").textContent); $("copy").textContent = "已复制"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("code")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); $("copy").textContent = "已复制"; }
    setTimeout(() => $("copy").textContent = "复制", 1200);
  });
</script>
</body>
</html>
